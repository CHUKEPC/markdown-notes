[project]
name = "markdown-notes"
version = "0.1.0"
description = "Markdown note-taking service with full-text search, versioning, tags, sharing, and import/export. Built with Django REST Framework and PostgreSQL"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "CHUKEPC"},
]
dependencies = [
    "django>=5.0.0,<6.0.0",
    "djangorestframework>=3.15.0",
    "django-filter>=24.1",
    "psycopg2-binary>=2.9.9",
    "markdown>=3.6",
    "bleach>=6.1.0",
    "python-dotenv>=1.0.1",
    "gunicorn>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-django>=4.8.0",
    "mypy>=1.10.0",
    "django-stubs[compatible-mypy]>=5.0.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15.0",
    "ruff>=0.4.0",
    "types-bleach>=6.1.0.1",
    "types-Markdown>=3.6.0.20240316",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]
ignore = ["E501", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["markdown_notes"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_subclassing_any = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "markdown_notes.config.settings"

[[tool.mypy.overrides]]
module = [
    "markdown.*",
    "bleach.*",
    "django_filters.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
django_settings_module = "markdown_notes.config.settings"
addopts = "-v --tb=short --cov=src/markdown_notes --cov-report=term-missing"
